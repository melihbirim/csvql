<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% seo %}
{% feed_meta %}
<style>
  :root { --bg:#12121f; --fg:#e8ecf4; --muted:#8b9bb4; --accent:#f7a41d; --accent2:#ff6f3c; --card:#1a1a2e; --line:#262a44; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  code,pre { font-family:"SF Mono","Fira Code",Consolas,monospace; }
  a { color:var(--accent); text-decoration:none; }
  a:hover { text-decoration:underline; }
  .wrap { max-width:680px; margin:0 auto; padding:0 20px; }
  .accent { background:linear-gradient(90deg,var(--accent),var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  header { padding:48px 20px 24px; }
  .back { font-size:14px; color:var(--muted); }
  h1 { font-size:clamp(26px,5vw,36px); margin:16px 0 6px; letter-spacing:-0.5px; line-height:1.25; }
  .date { color:var(--muted); font-size:14px; font-family:"SF Mono","Fira Code",monospace; }
  article { padding:12px 0 60px; }
  article h2 { font-size:22px; margin:36px 0 12px; letter-spacing:-0.3px; }
  article p { margin:16px 0; }
  code { background:var(--card); border:1px solid var(--line); border-radius:4px; padding:1px 6px; font-size:15px; }
  pre { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px; overflow-x:auto; }
  pre code { background:none; border:none; padding:0; }
  table { width:100%; border-collapse:collapse; margin:20px 0; font-size:15px; }
  th, td { text-align:left; padding:9px 12px; border:1px solid rgba(255,255,255,0.18); }
  th { color:var(--muted); font-weight:600; background:var(--card); }
  strong { color:var(--accent); }
  footer { text-align:center; color:var(--muted); padding:40px 20px; border-top:1px solid var(--line); font-size:14px; }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <a class="back" href="{{ site.baseurl }}/blog/">&larr; csvql blog</a>
    <h1>{{ page.title }}</h1>
    <div class="date">{{ page.date | date: "%Y-%m-%d" }}</div>
  </div>
</header>

<article class="wrap">
  {{ content }}
</article>

<footer>
  <div class="wrap">
    <a href="{{ site.baseurl }}/">csvql</a> &middot; <a href="https://github.com/melihbirim/csvql">GitHub</a>
  </div>
</footer>

</body>
</html>
