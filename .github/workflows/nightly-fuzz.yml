name: Nightly Differential Fuzz

# Volume run of the differential query generator (bench/query_fuzz.sh, #141).
# Different purpose from the per-PR smoke check in ci.yml: that one uses a
# fixed seed to catch a regression before merge; this one uses a random seed
# each run — a fixed seed re-tests the exact same queries forever, which
# stops finding anything new past the first run. This job is where the
# cumulative "N queries verified" number actually comes from: results
# append to VERIFICATION-LOG.md, which accumulates across every run.

on:
  schedule:
    - cron: "17 3 * * *"  # 03:17 UTC daily — avoid the top-of-hour stampede
  workflow_dispatch:
    inputs:
      count:
        description: "Number of queries to generate"
        required: false
        default: "50000"

permissions:
  contents: write

jobs:
  nightly-fuzz:
    name: Nightly differential fuzz (volume)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Zig
      uses: goto-bus-stop/setup-zig@v2
      with:
        version: 0.15.2

    - name: Build (ReleaseFast)
      run: zig build -Doptimize=ReleaseFast

    # Pinned via bench/DUCKDB_VERSION, not "latest" — a nightly log row is
    # only reproducible if the oracle version it names is the version that
    # actually ran. See CORRECTNESS.md's "Determinism guarantees" section.
    - name: Install DuckDB CLI
      run: |
        DUCKDB_VERSION="$(cat bench/DUCKDB_VERSION)"
        curl -fsSL "https://github.com/duckdb/duckdb/releases/download/v${DUCKDB_VERSION}/duckdb_cli-linux-amd64.zip" -o duckdb.zip
        unzip -o duckdb.zip -d /usr/local/bin
        chmod +x /usr/local/bin/duckdb

    - name: Generate fixture CSV
      run: ./bench/gen_fixture.sh

    - name: Pick a random seed and query count
      id: params
      run: |
        SEED=$RANDOM$RANDOM
        COUNT="${{ github.event.inputs.count || '50000' }}"
        echo "seed=$SEED" >> "$GITHUB_OUTPUT"
        echo "count=$COUNT" >> "$GITHUB_OUTPUT"

    - name: Run differential query generator at volume
      id: fuzz
      run: |
        set +e
        ./bench/query_fuzz.sh --seed "${{ steps.params.outputs.seed }}" --count "${{ steps.params.outputs.count }}" \
          | tee fuzz_output.txt
        echo "exit_code=$?" >> "$GITHUB_OUTPUT"

    - name: Append result to VERIFICATION-LOG.md
      run: |
        # Parsed from query_fuzz.sh's own "SUMMARY ..." line — that script is
        # the single source of truth for its own run's stats and the engine
        # versions it actually ran against, rather than re-deriving them here
        # and risking the two drifting apart.
        SUMMARY_LINE="$(grep '^SUMMARY ' fuzz_output.txt || true)"
        DISTINCT="$(echo "$SUMMARY_LINE" | grep -oE '(^| )distinct=[0-9]+' | cut -d= -f2)"
        TEMPLATES="$(echo "$SUMMARY_LINE" | grep -oE 'templates=[0-9]+' | cut -d= -f2)"
        MISMATCHES="$(echo "$SUMMARY_LINE" | grep -oE 'mismatches=[0-9]+' | cut -d= -f2)"
        CSVQL_VERSION="$(echo "$SUMMARY_LINE" | grep -oE 'csvql=[^ ]+' | cut -d= -f2)"
        DUCKDB_VERSION="$(echo "$SUMMARY_LINE" | grep -oE 'duckdb=[^ ]+' | cut -d= -f2)"
        DISTINCT="${DISTINCT:-unknown}"
        TEMPLATES="${TEMPLATES:-unknown}"
        MISMATCHES="${MISMATCHES:-unknown}"
        CSVQL_VERSION="${CSVQL_VERSION:-unknown}"
        DUCKDB_VERSION="${DUCKDB_VERSION:-unknown}"
        COMMAND="./bench/query_fuzz.sh --seed ${{ steps.params.outputs.seed }} --count ${{ steps.params.outputs.count }}"
        NOTES=""
        if [ "$MISMATCHES" != "0" ] && [ "$MISMATCHES" != "unknown" ]; then
          NOTES="see tests/regressions/ from this run's artifact"
        fi
        echo "| $(date -u +%Y-%m-%d) | ${{ steps.params.outputs.seed }} | ${{ steps.params.outputs.count }} | ${DISTINCT} | ${TEMPLATES} | ${MISMATCHES} | ${CSVQL_VERSION} | ${DUCKDB_VERSION} | \`${COMMAND}\` | ${NOTES} |" >> VERIFICATION-LOG.md

    - name: Commit VERIFICATION-LOG.md
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add VERIFICATION-LOG.md
        git diff --staged --quiet || git commit -m "chore: nightly differential fuzz result"
        git push

    - name: Upload regression files (if any)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: nightly-fuzz-regressions
        path: tests/regressions/
        if-no-files-found: ignore

    - name: Fail the job if any mismatch was found
      run: exit "${{ steps.fuzz.outputs.exit_code }}"
