name: Publish npm package

# Publishes csvql-query to npm with all platform binaries bundled.
# Uses npm trusted publishing (OIDC) — no token needed.
#
# One-time setup on npmjs.com:
#   Package: csvql-query → Settings → Publishing → Trusted Publishers → Add
#     Repository owner : melihbirim
#     Repository name  : csvql
#     Workflow filename: npm-publish.yml
#     Environment name : npm

on:
  # Auto-trigger after Release workflow completes successfully
  workflow_run:
    workflows: ["Release"]
    types: [completed]

  # Manual trigger: provide the Release workflow run ID to reuse its built artifacts.
  # Find the run ID in the URL: github.com/melihbirim/csvql/actions/runs/<ID>
  workflow_dispatch:
    inputs:
      run-id:
        description: "Release workflow run ID to pull node addon artifacts from"
        required: true
        type: string

permissions:
  contents: read
  id-token: write  # OIDC trusted publishing
  actions: read    # download artifacts from other workflow runs

jobs:
  publish:
    name: Publish csvql-query
    # For workflow_run: only run if the Release workflow succeeded
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - uses: actions/checkout@v4

      - name: Resolve source run ID
        id: src
        run: |
          if [ -n "${{ inputs.run-id }}" ]; then
            echo "id=${{ inputs.run-id }}" >> $GITHUB_OUTPUT
          else
            echo "id=${{ github.event.workflow_run.id }}" >> $GITHUB_OUTPUT
          fi

      - name: Download node addon artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: node-*
          path: artifacts/
          run-id: ${{ steps.src.outputs.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Arrange binaries
        run: |
          mkdir -p nodejs/binaries
          for plat in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64; do
            cp artifacts/node-$plat/csvql.node nodejs/binaries/$plat.node
          done

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Set version from tag
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('nodejs/package.json', 'utf8'));
            const tag = process.env.TAG;
            if (tag && tag.startsWith('v')) p.version = tag.replace(/^v/, '');
            fs.writeFileSync('nodejs/package.json', JSON.stringify(p, null, 2) + '\n');
          "
        env:
          TAG: ${{ github.ref_name }}

      - name: Publish
        run: npm publish --provenance --access public
        working-directory: nodejs
