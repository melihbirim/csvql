name: Publish npm package

# Publishes csvql-query to npm with all platform binaries bundled.
# Uses npm trusted publishing (OIDC) — no token needed.
#
# One-time setup on npmjs.com:
#   Package: csvql-query → Settings → Publishing → Trusted Publishers → Add
#     Repository owner : melihbirim
#     Repository name  : csvql
#     Workflow filename: npm-publish.yml
#     Environment name : npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write  # OIDC trusted publishing

jobs:
  # ── Build native addon on each platform ──────────────────────────────────────
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: darwin-arm64
          - os: macos-14
            name: darwin-x64
            zig-target: x86_64-macos
          - os: ubuntu-latest
            name: linux-x64
          - os: ubuntu-24.04-arm
            name: linux-arm64
          - os: windows-latest
            name: win32-x64

    steps:
      - uses: actions/checkout@v4

      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch Node.js headers (Windows toolcache lacks them)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          npm install -g node-gyp --silent
          node-gyp install
          NODE_INC=$(node -e "
            const path=require('path'),os=require('os'),ver=process.versions.node;
            process.stdout.write(path.join(os.homedir(),'.node-gyp',ver,'include','node').replace(/\\\\/g,'/'));
          ")
          echo "NODE_INCLUDE=$NODE_INC" >> $GITHUB_ENV

      - name: Build native addon
        shell: bash
        run: |
          TARGET="${{ matrix.zig-target }}"
          EXTRA=""
          [ -n "$TARGET" ] && EXTRA="-Dtarget=$TARGET"
          [ -n "$NODE_INCLUDE" ] && EXTRA="$EXTRA -Dnode-include=$NODE_INCLUDE"
          zig build node -Doptimize=ReleaseFast $EXTRA

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: zig-out/lib/csvql.node

  # ── Bundle all binaries and publish one package ───────────────────────────────
  publish:
    name: Publish csvql-query
    needs: build
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Arrange binaries
        run: |
          mkdir -p nodejs/binaries
          for plat in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64; do
            cp artifacts/$plat/csvql.node nodejs/binaries/$plat.node
          done

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Set version from tag
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('nodejs/package.json', 'utf8'));
            p.version = process.env.TAG.replace(/^v/, '');
            fs.writeFileSync('nodejs/package.json', JSON.stringify(p, null, 2) + '\n');
          "
        env:
          TAG: ${{ github.ref_name }}

      - name: Publish
        run: npm publish --provenance --access public
        working-directory: nodejs
