name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write  # npm OIDC trusted publishing

jobs:
  release:
    name: Build Release Binaries
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            zig-target: x86_64-linux
            artifact: csvql-linux-x86_64
            ext: ""
            pkg: tar.gz
          - os: macos-14
            zig-target: aarch64-macos
            artifact: csvql-macos-aarch64
            ext: ""
            pkg: tar.gz
          - os: macos-14
            zig-target: x86_64-macos
            artifact: csvql-macos-x86_64
            ext: ""
            pkg: tar.gz
          - os: ubuntu-latest
            zig-target: x86_64-windows
            artifact: csvql-windows-x86_64
            ext: ".exe"
            pkg: zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so the changelog step can diff against the previous tag

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.2

      - name: Build release binary
        run: zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.zig-target }}

      - name: Package (tar.gz)
        if: matrix.pkg == 'tar.gz'
        run: |
          mkdir -p release
          cp zig-out/bin/csvql release/${{ matrix.artifact }}
          cd release && tar -czf ${{ matrix.artifact }}.tar.gz ${{ matrix.artifact }}

      - name: Package (zip — Windows)
        if: matrix.pkg == 'zip'
        run: |
          mkdir -p release
          cp zig-out/bin/csvql${{ matrix.ext }} release/${{ matrix.artifact }}.exe
          cd release && zip ${{ matrix.artifact }}.zip ${{ matrix.artifact }}.exe

      - name: Package .mcpb bundle (one-click Claude Desktop install)
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p bundle/server release
          cp zig-out/bin/csvql${{ matrix.ext }} bundle/server/csvql${{ matrix.ext }}
          sed -e "s|\"version\": \"0.0.0\"|\"version\": \"$VERSION\"|" \
              -e "s|\"command\": \"server/csvql\"|\"command\": \"server/csvql${{ matrix.ext }}\"|" \
              mcpb/manifest.json > bundle/manifest.json
          ( cd bundle && zip -qr "../release/${{ matrix.artifact }}.mcpb" manifest.json server )

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/${{ matrix.artifact }}.${{ matrix.pkg }}

      - name: Generate changelog from commits since last tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${GITHUB_REF_NAME}\$" | head -n1)
          {
            echo "## What's fixed / changed"
            echo
            if [ -n "$PREV_TAG" ]; then
              git log --pretty=format:"- %s" "$PREV_TAG"..HEAD | grep -E "^- (fix|feat|perf):" || echo "- No categorized changes since $PREV_TAG"
            else
              echo "- Initial release"
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/${{ matrix.artifact }}.${{ matrix.pkg }}
            release/${{ matrix.artifact }}.mcpb
          body_path: release-notes.md
          draft: false
          prerelease: false

  build-node-addons:
    name: Node addon ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: darwin-arm64
          - os: macos-14
            name: darwin-x64
            zig-target: x86_64-macos
          - os: ubuntu-latest
            name: linux-x64
          - os: ubuntu-24.04-arm
            name: linux-arm64
          - os: windows-latest
            name: win32-x64

    steps:
      - uses: actions/checkout@v4
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Windows needs the headers (absent from the toolcache) AND node.lib,
      # the import library resolving napi_* at link time. Without node.lib the
      # DLL links with warnings and segfaults on first call — every Windows
      # addon published before this was broken that way.
      - name: Fetch Node.js headers and node.lib (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          NODE_VER=$(node -e "console.log(process.versions.node)")
          curl -fsSL "https://nodejs.org/dist/v${NODE_VER}/node-v${NODE_VER}-headers.tar.gz" -o node-headers.tar.gz
          tar -xzf node-headers.tar.gz
          curl -fsSL "https://nodejs.org/dist/v${NODE_VER}/win-x64/node.lib" -o node.lib
          echo "NODE_INCLUDE=node-v${NODE_VER}/include/node" >> $GITHUB_ENV
          echo "NODE_LIB=$(pwd)/node.lib" >> $GITHUB_ENV

      - name: Build native addon
        shell: bash
        run: |
          TARGET="${{ matrix.zig-target }}"
          EXTRA=""
          [ -n "$TARGET" ] && EXTRA="-Dtarget=$TARGET"
          [ -n "$NODE_INCLUDE" ] && EXTRA="$EXTRA \"-Dnode-include=$NODE_INCLUDE\""
          [ -n "$NODE_LIB" ] && EXTRA="$EXTRA \"-Dnode-lib=$NODE_LIB\""
          eval zig build node -Doptimize=ReleaseFast $EXTRA 2>&1 | tee build.log
          # Never publish an addon with unresolved N-API symbols.
          if grep -q "undefined symbol: napi_" build.log; then
            echo "FAIL: addon linked with undefined N-API symbols — refusing to publish"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: node-${{ matrix.name }}
          path: zig-out/lib/csvql.node

  publish-npm:
    name: Publish npm package
    needs: build-node-addons
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: node-*
          path: artifacts/

      - name: Arrange binaries
        run: |
          mkdir -p nodejs/binaries
          for plat in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64; do
            cp artifacts/node-$plat/csvql.node nodejs/binaries/$plat.node
          done

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm to 11.5.1+ for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Set version from tag
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('nodejs/package.json', 'utf8'));
            p.version = process.env.TAG.replace(/^v/, '');
            fs.writeFileSync('nodejs/package.json', JSON.stringify(p, null, 2) + '\n');
          "
        env:
          TAG: ${{ github.ref_name }}

      - name: Publish
        run: npm publish
        working-directory: nodejs
        env:
          NPM_CONFIG_PROVENANCE: true

  update-homebrew:
    name: Update Homebrew Formula
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Wait for release assets to be available
        run: sleep 15

      - name: Download release assets and compute SHA256
        id: hashes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BASE="https://github.com/melihbirim/csvql/releases/download/v${VERSION}"

          curl -L -o macos-aarch64.tar.gz "${BASE}/csvql-macos-aarch64.tar.gz"
          curl -L -o macos-x86_64.tar.gz  "${BASE}/csvql-macos-x86_64.tar.gz"
          curl -L -o linux-x86_64.tar.gz  "${BASE}/csvql-linux-x86_64.tar.gz"

          echo "sha_macos_arm=$(sha256sum macos-aarch64.tar.gz | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "sha_macos_x86=$(sha256sum macos-x86_64.tar.gz  | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "sha_linux_x86=$(sha256sum linux-x86_64.tar.gz  | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Update Homebrew formula
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          script: |
            const version  = "${{ steps.version.outputs.version }}";
            const shaArm   = "${{ steps.hashes.outputs.sha_macos_arm }}";
            const shaX86   = "${{ steps.hashes.outputs.sha_macos_x86 }}";
            const shaLinux = "${{ steps.hashes.outputs.sha_linux_x86 }}";
            const base     = `https://github.com/melihbirim/csvql/releases/download/v${version}`;

            const formula = `class Csvql < Formula
              desc "Ultra-fast SQL query engine for CSV files with SIMD parsing and parallel execution"
              homepage "https://github.com/melihbirim/csvql"
              version "${version}"
              license "MIT"

              on_macos do
                on_arm do
                  url "${base}/csvql-macos-aarch64.tar.gz"
                  sha256 "${shaArm}"
                end
                on_intel do
                  url "${base}/csvql-macos-x86_64.tar.gz"
                  sha256 "${shaX86}"
                end
              end

              on_linux do
                on_intel do
                  url "${base}/csvql-linux-x86_64.tar.gz"
                  sha256 "${shaLinux}"
                end
              end

              def install
                bin.install Dir["csvql-*"].first => "csvql"
              end

              test do
                (testpath/"test.csv").write("name,age\\nAlice,30\\nBob,25\\n")
                output = shell_output("#{bin}/csvql \\"SELECT name FROM 'test.csv' WHERE age > 26\\"")
                assert_match "Alice", output
              end
            end
            `;

            // Get current file SHA (needed for update)
            const { data: current } = await github.rest.repos.getContent({
              owner: "melihbirim",
              repo:  "homebrew-csvql",
              path:  "Formula/csvql.rb",
            });

            await github.rest.repos.createOrUpdateFileContents({
              owner:   "melihbirim",
              repo:    "homebrew-csvql",
              path:    "Formula/csvql.rb",
              message: `chore: update formula to v${version}`,
              content: Buffer.from(formula).toString("base64"),
              sha:     current.sha,
            });

  publish-mcp-registry:
    name: Publish to MCP Registry
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      id-token: write # OIDC auth to registry.modelcontextprotocol.io
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Wait for release assets to be available
        run: sleep 15

      - name: Update server.json for this release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BASE="https://github.com/melihbirim/csvql/releases/download/${GITHUB_REF_NAME}"
          for a in csvql-macos-aarch64.mcpb csvql-macos-x86_64.mcpb csvql-linux-x86_64.mcpb csvql-windows-x86_64.mcpb; do
            curl -fsSL -o "$a" "${BASE}/${a}"
          done
          python3 - "$VERSION" "$GITHUB_REF_NAME" <<'PY'
          import json, subprocess, sys
          version, tag = sys.argv[1], sys.argv[2]
          def sha(f):
              return subprocess.check_output(["sha256sum", f]).split()[0].decode()
          hashes = {
              "csvql-macos-aarch64.mcpb": sha("csvql-macos-aarch64.mcpb"),
              "csvql-macos-x86_64.mcpb": sha("csvql-macos-x86_64.mcpb"),
              "csvql-linux-x86_64.mcpb": sha("csvql-linux-x86_64.mcpb"),
              "csvql-windows-x86_64.mcpb": sha("csvql-windows-x86_64.mcpb"),
          }
          with open("server.json") as f:
              doc = json.load(f)
          doc["version"] = version
          for pkg in doc["packages"]:
              name = pkg["identifier"].rsplit("/", 1)[-1]
              pkg["identifier"] = f"https://github.com/melihbirim/csvql/releases/download/{tag}/{name}"
              pkg["fileSha256"] = hashes[name]
          with open("server.json", "w") as f:
              json.dump(doc, f, indent=2)
              f.write("\n")
          PY

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish

  publish-pypi:
    name: Publish Python wheels to PyPI
    needs: release
    runs-on: ${{ matrix.os }}
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            plat: manylinux_2_17_x86_64
          - os: ubuntu-24.04-arm
            plat: manylinux_2_17_aarch64
          - os: macos-14
            arch: x86_64
            plat: macosx_12_0_x86_64
          - os: macos-14
            arch: arm64
            plat: macosx_12_0_arm64
          - os: windows-latest
            plat: win_amd64

    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Zig shared library
        run: zig build -Doptimize=ReleaseFast

      # Zig installs the shared library into zig-out/lib on POSIX, but puts a
      # Windows DLL in zig-out/bin (only the import library csvql.lib goes to
      # lib/). _loader.py knows both locations; this staging step has to too.
      - name: Copy library into package
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            cp zig-out/lib/libcsvql.dylib python/csvql/libcsvql.dylib
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            cp zig-out/bin/csvql.dll python/csvql/csvql.dll
          else
            cp zig-out/lib/libcsvql.so python/csvql/libcsvql.so
          fi

      # Never ship a wheel whose library does not load. This is the PyPI-side
      # equivalent of the node-addon check — a built artifact proves nothing
      # about whether it runs (see #149).
      - name: Smoke-test the staged library
        shell: bash
        run: python python/test_csvql.py

      - name: Build wheel
        working-directory: python
        shell: bash
        run: |
          pip install --upgrade setuptools build wheel
          # Set version from git tag (strips leading 'v')
          TAG="${GITHUB_REF_NAME#v}"
          sed -i.bak "s/^version = .*/version = \"$TAG\"/" pyproject.toml
          python -m build --wheel --no-isolation
          # Rename wheel to correct platform tag
          cd dist
          for f in *.whl; do
            mv "$f" "${f/py3-none-any/py3-none-${{ matrix.plat }}}" 2>/dev/null || true
          done

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.plat }}
          path: python/dist/*.whl

  pypi-upload:
    name: Upload all wheels to PyPI
    needs: publish-pypi
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    environment:
      name: pypi
      url: https://pypi.org/p/csvql-query

    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
