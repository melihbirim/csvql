name: CI

on:
  push:
    branches: [ main, fix/code-review-issues ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Build
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            exe: ./zig-out/bin/csvql
          - os: macos-14
            exe: ./zig-out/bin/csvql
          - os: windows-latest
            exe: zig-out/bin/csvql.exe
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Zig
      uses: goto-bus-stop/setup-zig@v2
      with:
        version: 0.15.2

    - name: Cache Zig artifacts
      uses: actions/cache@v4
      with:
        path: |
          .zig-cache
          zig-out
        key: ${{ runner.os }}-zig-${{ hashFiles('build.zig') }}
        restore-keys: |
          ${{ runner.os }}-zig-

    - name: Run tests
      run: zig build test --summary all

    - name: Build (Debug)
      run: zig build

    - name: Build (ReleaseFast)
      run: zig build -Doptimize=ReleaseFast

    - name: Verify executable
      run: ${{ matrix.exe }} --version

    - name: Generate test CSV
      if: matrix.os == 'ubuntu-latest'
      run: |
        echo "id,name,age" > test_ci.csv
        echo "1,Alice,30" >> test_ci.csv
        echo "2,Bob,25" >> test_ci.csv

    - name: Test query execution
      if: matrix.os == 'ubuntu-latest'
      run: |
        ./zig-out/bin/csvql "SELECT * FROM 'test_ci.csv'" | tee output.csv
        [ $(wc -l < output.csv) -eq 3 ] && echo "Query test passed"

  lint:
    name: Format Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Zig
      uses: goto-bus-stop/setup-zig@v2
      with:
        version: 0.15.2

    - name: Check formatting
      run: zig fmt --check src/ tests/ build.zig

  correctness:
    name: Correctness vs DuckDB
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Zig
      uses: goto-bus-stop/setup-zig@v2
      with:
        version: 0.15.2

    - name: Build (ReleaseFast)
      run: zig build -Doptimize=ReleaseFast

    - name: Install DuckDB CLI
      run: |
        curl -fsSL https://github.com/duckdb/duckdb/releases/latest/download/duckdb_cli-linux-amd64.zip -o duckdb.zip
        unzip -o duckdb.zip -d /usr/local/bin
        chmod +x /usr/local/bin/duckdb
        duckdb --version

    - name: Generate fixture CSV
      run: |
        awk 'BEGIN{
          split("Alice Bob Carol Dave Eve Frank Grace Heidi", names, " ");
          split("Austin Boston Chicago Denver LA NYC SF Seattle", cities, " ");
          split("Engineering Finance HR Marketing Operations Sales", depts, " ");
          print "id,name,age,city,salary,department";
          for (i = 1; i <= 20000; i++) {
            n = names[(i % 8) + 1]; c = cities[(i % 8) + 1]; d = depts[(i % 6) + 1];
            age = 20 + (i % 40);
            salary = 40000 + (i % 80) * 1000;
            print i","n","age","c","salary","d;
          }
        }' > large_test.csv

    - name: Run correctness suite (treats DuckDB as oracle)
      run: ./bench/verify_correctness.sh
