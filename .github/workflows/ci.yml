name: CI

on:
  push:
    branches: [ main, fix/code-review-issues ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Build
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            exe: ./zig-out/bin/csvql
          - os: macos-14
            exe: ./zig-out/bin/csvql
          - os: windows-latest
            exe: zig-out/bin/csvql.exe
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Zig
      uses: goto-bus-stop/setup-zig@v2
      with:
        version: 0.15.2

    - name: Cache Zig artifacts
      uses: actions/cache@v4
      with:
        path: |
          .zig-cache
          zig-out
        key: ${{ runner.os }}-zig-${{ hashFiles('build.zig') }}
        restore-keys: |
          ${{ runner.os }}-zig-

    - name: Run tests
      run: zig build test --summary all

    - name: Build (Debug)
      run: zig build

    - name: Build (ReleaseFast)
      run: zig build -Doptimize=ReleaseFast

    - name: Verify executable
      run: ${{ matrix.exe }} --version

    - name: Generate test CSV
      if: matrix.os == 'ubuntu-latest'
      run: |
        echo "id,name,age" > test_ci.csv
        echo "1,Alice,30" >> test_ci.csv
        echo "2,Bob,25" >> test_ci.csv

    - name: Test query execution
      if: matrix.os == 'ubuntu-latest'
      run: |
        ./zig-out/bin/csvql "SELECT * FROM 'test_ci.csv'" | tee output.csv
        [ $(wc -l < output.csv) -eq 3 ] && echo "Query test passed"

  lint:
    name: Format Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Zig
      uses: goto-bus-stop/setup-zig@v2
      with:
        version: 0.15.2

    - name: Check formatting
      run: zig fmt --check src/ tests/ build.zig

  correctness:
    name: Correctness vs DuckDB
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Zig
      uses: goto-bus-stop/setup-zig@v2
      with:
        version: 0.15.2

    - name: Build (ReleaseFast)
      run: zig build -Doptimize=ReleaseFast

    # macos-14 runners are Apple Silicon (aarch64) — this is the only
    # differential-verification coverage the SIMD-accelerated parser gets on
    # ARM, where most desktop users actually run csvql. DuckDB ships a
    # universal (x86_64+arm64) binary for macOS, one URL covers both archs.
    #
    # Version is pinned via bench/DUCKDB_VERSION (not "latest") — the oracle
    # must not change out from under a query set without a deliberate,
    # reviewed bump. See CORRECTNESS.md's "Determinism guarantees" section.
    - name: Install DuckDB CLI (Linux)
      if: runner.os == 'Linux'
      run: |
        DUCKDB_VERSION="$(cat bench/DUCKDB_VERSION)"
        curl -fsSL "https://github.com/duckdb/duckdb/releases/download/v${DUCKDB_VERSION}/duckdb_cli-linux-amd64.zip" -o duckdb.zip
        unzip -o duckdb.zip -d /usr/local/bin
        chmod +x /usr/local/bin/duckdb
        duckdb --version

    - name: Install DuckDB CLI (macOS)
      if: runner.os == 'macOS'
      run: |
        DUCKDB_VERSION="$(cat bench/DUCKDB_VERSION)"
        curl -fsSL "https://github.com/duckdb/duckdb/releases/download/v${DUCKDB_VERSION}/duckdb_cli-osx-universal.zip" -o duckdb.zip
        unzip -o duckdb.zip -d /usr/local/bin
        chmod +x /usr/local/bin/duckdb
        duckdb --version

    - name: Generate fixture CSV
      run: ./bench/gen_fixture.sh

    - name: Run correctness suite (treats DuckDB as oracle)
      run: ./bench/verify_correctness.sh

    # Differential query generator (#141) — fixed seed, smoke scale (300
    # queries, ~15s). Purpose here is catching a regression before merge,
    # not producing a volume number — that's the nightly job's job (see
    # .github/workflows/nightly-fuzz.yml), which runs a random seed at
    # much higher volume and appends the cumulative result to
    # VERIFICATION-LOG.md. Failures here dump to tests/regressions/ and
    # fail the job (not committed automatically — a human reviews and
    # commits a genuine regression file).
    - name: Run differential query generator (smoke scale)
      run: ./bench/query_fuzz.sh --seed 1 --count 300
