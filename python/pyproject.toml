[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csvql-query"
version = "2.10.0"
description = "Run SQL on CSV files in place from Python. Query large CSV files fast with no import and no database. A CSV SQL engine in Zig with SIMD parsing. Read only by design."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["csv", "query", "sql", "fast", "simd", "agent", "ai", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
pandas = ["pandas>=1.5"]

[project.urls]
Homepage = "https://github.com/melihbirim/csvql"
Repository = "https://github.com/melihbirim/csvql"

[tool.setuptools.packages.find]
where = ["."]
include = ["csvql*"]

[tool.setuptools.package-data]
csvql = ["*.so", "*.dylib", "*.dll"]
